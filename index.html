<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Atlas Demo</title>
  <style>
    :root{
      --bg:#f4f7fb;--ink:#11203b;--muted:#5d6b82;--card:#fff;
      --primary:#14532d;--primary-2:#0f766e;--shadow:0 18px 45px rgba(17,32,59,0.08);
      --radius:18px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{
      margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#eef5ff 0%,#fff 100%);color:var(--ink)
    }
    a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button,input,select{font:inherit}
    .container{max-width:1200px;margin:0 auto;padding:24px 18px 48px}
    .topbar{position:sticky;top:0;z-index:9;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);border-bottom:1px solid rgba(17,32,59,0.06)}
    .nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 18px}
    .logo{font-size:1.2rem;font-weight:800}
    .tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .lang-switcher{display:flex;gap:8px;flex-wrap:wrap}
    .lang-btn{background:#e8eef7;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--ink)}
    .lang-btn.active{background:var(--primary);color:#fff}
    .search-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .search-box input, .search-box select{padding:10px 12px;border-radius:12px;border:1px solid rgba(17,32,59,0.08);background:#fff}
    .hero{display:grid;grid-template-columns:1.2fr 0.8fr;gap:0;overflow:hidden;border-radius:var(--radius);background:linear-gradient(135deg,#0f766e 0%,#14532d 100%);box-shadow:var(--shadow);color:#fff}
    .hero-copy{padding:32px}
    .hero-copy h1{margin:0 0 12px;font-size:clamp(2rem,4vw,3rem);line-height:1.1}
    .hero-copy p{margin:0 0 20px;color:rgba(255,255,255,0.9);max-width:60ch;line-height:1.8}
    .hero-visual{min-height:270px;background-image:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80');background-size:cover;background-position:center}
    .primary-btn{display:inline-block;padding:10px 16px;border-radius:999px;background:#fff;color:var(--primary);font-weight:800}
    .section-title{display:flex;align-items:flex-end;justify-content:space-between;margin:30px 0 18px;gap:12px}
    .section-title h2{margin:0;font-size:clamp(1.6rem,2vw,2.2rem)}
    .country-grid,.city-grid,.attraction-grid{display:grid;gap:18px}
    .country-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .city-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .attraction-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
    .card{background:var(--card);border:1px solid rgba(17,32,59,0.06);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
    .card-media{height:210px;background-size:cover;background-position:center}
    .card-body{padding:18px}
    .card-body h3{margin:0 0 8px;font-size:1.2rem}
    .card-body p{margin:0;color:var(--muted);line-height:1.7}
    .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
    .badge{background:rgba(20,83,45,0.08);color:var(--primary);padding:7px 10px;border-radius:999px;font-weight:800;font-size:.75rem}
    .country-link, .city-link{display:inline-block;background:var(--primary);color:var(--card);padding:8px 12px;border-radius:999px;font-weight:700}
    .country-section{margin-top:34px;padding-top:8px}
    .country-header{display:grid;grid-template-columns:1.15fr .85fr;gap:0;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#fff;border:1px solid rgba(17,32,59,0.06)}
    .country-header img{width:100%;height:100%;object-fit:cover}
    .country-header .content{padding:24px}
    .country-header h2{margin:0 0 8px;font-size:clamp(1.8rem,3vw,2.8rem)}
    .country-header p{margin:0;color:var(--muted);line-height:1.8}
    .meta-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
    .meta-pill{background:#edf6f3;color:var(--primary);padding:7px 10px;border-radius:999px;font-weight:700;font-size:.8rem}
    .footer{padding:22px 0 36px;text-align:center;color:var(--muted)}
    @media (max-width: 860px){ .hero,.country-header{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start}.tools{width:100%}.search-box{width:100%}.search-box input{flex:1}} 
  </style>
</head>
<body>

            <option value="withImages">دارای تصویر</option>
          </select>
        </div>
        <div class="lang-switcher" aria-label="Language switcher">
          <button class="lang-btn active" data-lang="fa">فارسی</button>
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
        </div>
      </div>
    </div>
  </header>

        <p data-i18n='{"fa":"این دمو نمونه‌ای از کشورها، شهرها و جاذبه‌های گردشگری است. هر بخش با تصویر، توضیح و لینک جداگانه طراحی شده است.","en":"This demo is a sample tourism atlas showing countries, cities, and attractions. Each section includes its own image, description, and anchor links.","fr":"Cette démo est un atlas touristique d’exemple montrant des pays, villes et attractions. Chaque section contient son propre image, description et liens d’ancrage."}'>این دمو نمونه‌ای از کشورها، شهرها و جاذبه‌های گردشگری است. هر بخش با تصویر، توضیح و لینک جداگانه طراحی شده است.</p>
        <a href="#countries" class="primary-btn" data-i18n='{"fa":"دیدن کشورها","en":"Explore countries","fr":"Voir les pays"}'>دیدن کشورها</a>
      </div>
      <div class="hero-visual" aria-label="travel panorama"></div>
    </section>

    <div id="countries" class="section-title">

    </div>
    <section id="countryGrid" class="country-grid" aria-label="country list"></section>

    <section id="countryDetails" aria-label="country details"></section>
  </main>

  <footer class="footer">
    Travel Atlas Demo • Persian • English • Français

    const state = { lang: 'fa' };

    function t(value, lang) {
      if (!value) return '';
      return value[lang] || value.fa || value.en || '';
    }

    function renderLanguageButtons(){
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === state.lang);
      });
    }

    function renderCountryGrid() {
      const grid = document.getElementById('countryGrid');
      grid.innerHTML = '';
      data.countries.forEach(country => {
        const card = document.createElement('article');
        card.className = 'card';
        const cityCount = country.cities.length;
        card.innerHTML = `
          <div class="card-media" style="background-image:url('${country.image}')"></div>
          <div class="card-body">
            <h3>${t(country.name, state.lang)}</h3>
            <p>${t(country.overview, state.lang)}</p>
            <div class="card-foot">
              <span class="badge">${cityCount} ${state.lang === 'fa' ? 'شهر' : state.lang === 'en' ? 'cities' : 'villes'}</span>
              <a href="#${country.id}" class="country-link">${state.lang === 'fa' ? 'بازدید' : state.lang === 'en' ? 'View' : 'Voir'}</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderCountryDetails() {
      const host = document.getElementById('countryDetails');
      host.innerHTML = '';
      data.countries.forEach(country => {
        const section = document.createElement('section');
        section.id = country.id;
        section.className = 'country-section';
        const cityCards = country.cities.map(city => `
          <article class="card" id="${city.id}">
            <div class="card-media" style="background-image:url('${city.image}')"></div>
            <div class="card-body">
              <h3>${t(city.name, state.lang)}</h3>
              <p>${t(city.summary, state.lang)}</p>
              <div class="card-foot">
                <span class="badge">${city.attractions.length} ${state.lang === 'fa' ? 'جاذبه' : state.lang === 'en' ? 'attractions' : 'attractions'}</span>
                <a href="#${city.id}" class="city-link">${state.lang === 'fa' ? 'شهر' : state.lang === 'en' ? 'City' : 'Ville'}</a>
              </div>
              <div class="attraction-grid" style="margin-top:16px;">
                ${city.attractions.map(attraction => `
                  <div class="card" style="overflow:hidden;">
                    <div class="card-media" style="height:160px;background-image:url('${attraction.image}')"></div>
                    <div class="card-body">
                      <h3>${t(attraction.title, state.lang)}</h3>
                      <p>${t(attraction.description, state.lang)}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </article>
        `).join('');

        section.innerHTML = `
          <div class="country-header">
            <img src="${country.image}" alt="${t(country.name, state.lang)}" />
            <div class="content">
              <h2>${t(country.heroTitle, state.lang)}</h2>
              <p>${t(country.overview, state.lang)}</p>
              <div class="meta-list">
                ${country.badges.map(b => `<span class="meta-pill">${b}</span>`).join('')}
              </div>
            </div>
          </div>
          <div class="section-title" style="margin-top:24px;">
            <h2>${state.lang === 'fa' ? 'شهرهای مهم' : state.lang === 'en' ? 'Key cities' : 'Villes clés'}</h2>
          </div>
          <div class="city-grid">${cityCards}</div>
        `;
        host.appendChild(section);
      });
    }

    function render() {
      renderLanguageButtons();
      renderCountryGrid();
      renderCountryDetails();
      applySearch();
      document.querySelectorAll('[data-i18n]').forEach(el => {
        try {
          const obj = JSON.parse(el.dataset.i18n);
          el.textContent = obj[state.lang] || obj.fa || obj.en || '';
        } catch (e) {}
      });
    }

    function applySearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const filter = document.getElementById('filterSelect').value;
      const allCards = document.querySelectorAll('.card');
      allCards.forEach(card => {
        const text = card.innerText.toLowerCase();
        let match = true;
        if (q && !text.includes(q)) match = false;
        if (filter === 'withImages') {
          const hasImage = card.querySelector('.card-media') && card.querySelector('.card-media').style.backgroundImage;
          if (!hasImage) match = false;
        }
        card.style.display = match ? '' : 'none';
      });
    }

    document.getElementById('searchInput').addEventListener('input', applySearch);
    document.getElementById('filterSelect').addEventListener('change', applySearch);

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.lang = btn.dataset.lang;
        render();
      });
    });

    render();
  </script>
</body>
</html>
